name: Update Complete Info

on:
  schedule:
    # ── 24時間収集スケジュール ──────────────────────────────────────────────
    # JST 15:00〜翌2:00（夕方〜深夜・パチンコ営業時間帯）: 30分ごと フル収集
    # UTC 06:00〜17:00（30分間隔）
    - cron: "*/30 6-17 * * *"
    # JST 08:00・10:00・12:00（午前中）: 追加ラン（前日漏れ補完 + 朝投稿キャッチ）
    # UTC 23:00（JST 08:00）
    - cron: "0 23 * * *"
    # UTC 01:00（JST 10:00）
    - cron: "0 1 * * *"
    # UTC 04:00（JST 13:00）
    - cron: "0 4 * * *"
    # ── 夜間補完（メインウィンドウ後のギャップ埋め）──────────────────────────
    # UTC 18:00 = JST 翌03:00: メインウィンドウ終了(17:30)後の最初のフォールバック
    - cron: "0 18 * * *"
    # UTC 20:00 = JST 翌05:00: 深夜補完
    - cron: "0 20 * * *"
    # UTC 22:00 = JST 翌07:00: 朝前の最終補完（verify_complete.yml 実行直前）
    - cron: "0 22 * * *"
  workflow_dispatch: # 手動実行も可
    inputs:
      date:
        description: '収集対象日 (YYYY-MM-DD形式、省略時は当日JST)'
        required: false
        default: ''

permissions:
  contents: write

# ── 並列実行防止: 同じワークフローは必ず直列化する ─────────────────────────────
# cancel-in-progress: false = 前の実行が終わるまで次の実行はキューで待機
# これにより complete_info.json / complete_ranking.json の同時書き換えを防止
concurrency:
  group: update-complete
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # スクリプト28分 + インストール5分 + git push = 十分な余裕

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth cryptography
          playwright install chromium --with-deps

      - name: Fetch complete info from X
        timeout-minutes: 35  # スクリプト内28分制限 + 余裕7分
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          COOKIE_ENCRYPT_KEY: ${{ secrets.COOKIE_ENCRYPT_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # JST 日付を明示（GH Actions は UTC ランナー）
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "🕐 JST: $TODAY_JST"

          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "📅 指定日付: ${{ github.event.inputs.date }}"
            python scripts/fetch_complete_info.py --headless --date "${{ github.event.inputs.date }}"
          else
            # since_date が2日前まで拡張されているため深夜ダブルランは不要
            python scripts/fetch_complete_info.py --headless --date "$TODAY_JST"
          fi

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          # ── コンフリクトを起こさない push 方式 ─────────────────────────────────
          for i in 1 2 3 4 5; do
            # 生成ファイルを一時退避（complete_info.json + 日付別ファイル + ranking）
            cp public/complete_info.json    /tmp/complete_info.json.bak
            cp public/complete_ranking.json /tmp/complete_ranking.json.bak
            cp scripts/.x_session.enc /tmp/x_session.enc.bak 2>/dev/null || true
            # 日付別ファイルをすべてバックアップ
            mkdir -p /tmp/complete_days
            cp public/complete_20??-??-??.json /tmp/complete_days/ 2>/dev/null || true

            # 最新リモートに同期
            git fetch origin main
            git reset --hard origin/main

            # 生成ファイルを復元
            cp /tmp/complete_info.json.bak    public/complete_info.json
            cp /tmp/complete_ranking.json.bak public/complete_ranking.json
            cp /tmp/x_session.enc.bak scripts/.x_session.enc 2>/dev/null || true
            cp /tmp/complete_days/complete_20??-??-??.json public/ 2>/dev/null || true

            # 変更があるファイルだけ add
            git add public/complete_info.json public/complete_ranking.json
            git add public/complete_20??-??-??.json 2>/dev/null || true
            git add public/store_handles.json public/store_x_urls.json 2>/dev/null || true
            git add scripts/.x_session.enc 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi

            COUNT=$(python3 -c "import json; d=json.load(open('public/complete_info.json')); print(len(d))")
            git commit -m "chore: update complete_info.json (${COUNT}件) + ranking"

            if git push; then
              echo "✅ Push succeeded (attempt ${i})"
              break
            else
              git reset HEAD~1
              echo "⚠️ Push attempt ${i} failed, retrying in 10s..."
              sleep 10
            fi
          done

name: Update Complete Info

on:
  schedule:
    # JST 15:00〜翌2:00を30分ごと実行（Publicリポジトリ=無制限無料）
    # UTC 06:00〜17:00（30分間隔）= JST 15:00〜翌2:00
    - cron: "*/30 6-17 * * *"
  workflow_dispatch: # 手動実行も可
    inputs:
      date:
        description: '収集対象日 (YYYY-MM-DD形式、省略時は当日JST)'
        required: false
        default: ''

permissions:
  contents: write

# ── 並列実行防止: 同じワークフローは必ず直列化する ─────────────────────────────
# cancel-in-progress: false = 前の実行が終わるまで次の実行はキューで待機
# これにより complete_info.json / complete_ranking.json の同時書き換えを防止
concurrency:
  group: update-complete
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # スクリプト28分 + インストール5分 + git push = 十分な余裕

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps

      - name: Fetch complete info from X
        timeout-minutes: 35  # スクリプト内28分制限 + 余裕7分
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # JST 日付を明示（GH Actions は UTC ランナー）
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          HOUR_JST=$(TZ=Asia/Tokyo date +%H)
          echo "🕐 JST: $TODAY_JST (${HOUR_JST}時)"

          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "📅 指定日付: ${{ github.event.inputs.date }}"
            python scripts/fetch_complete_info.py --headless --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch_complete_info.py --headless --date "$TODAY_JST"

            # 深夜0〜5時は前日分も収集（日付またぎで漏れた分を補完）
            if [ "$HOUR_JST" -lt 6 ]; then
              YESTERDAY_JST=$(TZ=Asia/Tokyo date -d "yesterday" +%Y-%m-%d)
              echo "🌙 深夜のため前日 $YESTERDAY_JST も再収集"
              python scripts/fetch_complete_info.py --headless --date "$YESTERDAY_JST"
            fi
          fi

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          # ── コンフリクトを起こさない push 方式 ─────────────────────────────────
          # スクリプト実行中に別コミットが push された場合でも安全にマージするため、
          # 「生成ファイルを退避 → 最新リモートに reset → 復元 → commit → push」を繰り返す
          for i in 1 2 3 4 5; do
            # 生成ファイルを一時退避
            cp public/complete_info.json    /tmp/complete_info.json.bak
            cp public/complete_ranking.json /tmp/complete_ranking.json.bak

            # 最新リモートに同期（スクリプト実行中に push されたコミットも取り込む）
            git fetch origin main
            git reset --hard origin/main

            # 生成ファイルを復元
            cp /tmp/complete_info.json.bak    public/complete_info.json
            cp /tmp/complete_ranking.json.bak public/complete_ranking.json

            # 変更がなければ終了
            git add public/complete_info.json public/complete_ranking.json
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi

            COUNT=$(python3 -c "import json; d=json.load(open('public/complete_info.json')); print(len(d))")
            git commit -m "chore: update complete_info.json (${COUNT}件) + ranking"

            if git push; then
              echo "✅ Push succeeded (attempt ${i})"
              break
            else
              # push 失敗 → コミットを取り消して再試行（別コミットが先に push された可能性）
              git reset HEAD~1
              echo "⚠️ Push attempt ${i} failed, retrying in 10s..."
              sleep 10
            fi
          done

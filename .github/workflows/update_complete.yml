name: Update Complete Info

on:
  schedule:
    # ── 24時間収集スケジュール ──────────────────────────────────────────────
    # JST 15:00〜翌2:00（夕方〜深夜・パチンコ営業時間帯）: 30分ごと フル収集
    # UTC 06:00〜17:00（30分間隔）
    - cron: "*/30 6-17 * * *"
    # ── プライムタイム固定補完（スケジューラーgap対策）──────────────────────
    # UTC 13:00 = JST 22:00: 21:00〜22:00帯の漏れ補完（コンプ投稿ピーク帯）
    - cron: "0 13 * * *"
    # UTC 14:30 = JST 23:30: 22:30〜23:30帯の漏れ補完
    - cron: "30 14 * * *"
    # JST 08:00・10:00・12:00（午前中）: 追加ラン（前日漏れ補完 + 朝投稿キャッチ）
    # UTC 23:00（JST 08:00）
    - cron: "0 23 * * *"
    # UTC 01:00（JST 10:00）
    - cron: "0 1 * * *"
    # UTC 04:00（JST 13:00）
    - cron: "0 4 * * *"
    # ── 夜間補完（メインウィンドウ後のギャップ埋め）──────────────────────────
    # UTC 18:00 = JST 翌03:00: メインウィンドウ終了(17:30)後の最初のフォールバック
    - cron: "0 18 * * *"
    # UTC 20:00 = JST 翌05:00: 深夜補完
    - cron: "0 20 * * *"
    # UTC 22:00 = JST 翌07:00: 朝前の最終補完（verify_complete.yml 実行直前）
    - cron: "0 22 * * *"
  workflow_dispatch: # 手動実行も可
    inputs:
      date:
        description: '収集対象日 (YYYY-MM-DD形式、省略時は当日JST)'
        required: false
        default: ''

permissions:
  contents: write

# ── 並列実行防止: store_handles.json を書く全 workflow を直列化する ─────────────
# cancel-in-progress: false = 前の実行が終わるまで次の実行はキューで待機
# これにより complete_info.json / complete_ranking.json の同時書き換えを防止し、
# さらに store_handles.json を書く discover_manager_handles / resolve_store_handles と
# 同一グループ(store-handles-writer)で直列化して stale overwrite を防止する。
concurrency:
  group: store-handles-writer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70  # keyword_b:250クエリ≒40分 / manager:220ハンドル≒55分 + バッファ
    strategy:
      matrix:
        # 7並列: handle_a〜d（rank1-200直接クエリ）+ keyword_a/b（全国キーワード）+ manager（店長専用）
        mode: [handle_a, handle_b, handle_c, handle_d, keyword_a, keyword_b, manager]
      fail-fast: false  # 1ジョブ失敗でも他は継続

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth cryptography
          playwright install chromium --with-deps

      - name: Fetch complete info (${{ matrix.mode }})
        timeout-minutes: 65
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          COOKIE_ENCRYPT_KEY: ${{ secrets.COOKIE_ENCRYPT_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "🕐 JST: $TODAY_JST  mode: ${{ matrix.mode }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
          else
            TARGET_DATE="$TODAY_JST"
          fi
          python scripts/fetch_complete_info.py \
            --headless \
            --date "$TARGET_DATE" \
            --mode "${{ matrix.mode }}" \
            --partial

      - name: Upload partial result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-partial-${{ matrix.mode }}
          path: public/complete_partial_${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 1

  merge:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()  # 一部のcollectジョブが失敗しても統合は実行

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Download all partial results
        uses: actions/download-artifact@v4
        with:
          pattern: complete-partial-*
          path: public/
          merge-multiple: true

      - name: Merge partial results
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
          else
            TARGET_DATE="$TODAY_JST"
          fi
          python scripts/merge_complete_data.py --date "$TARGET_DATE"

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          for i in 1 2 3 4 5; do
            cp public/complete_info.json    /tmp/complete_info.json.bak
            cp public/complete_ranking.json /tmp/complete_ranking.json.bak
            cp scripts/.x_session.enc /tmp/x_session.enc.bak 2>/dev/null || true
            mkdir -p /tmp/complete_days
            cp public/complete_20??-??-??.json /tmp/complete_days/ 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/complete_info.json.bak    public/complete_info.json
            cp /tmp/complete_ranking.json.bak public/complete_ranking.json
            cp /tmp/x_session.enc.bak scripts/.x_session.enc 2>/dev/null || true
            cp /tmp/complete_days/complete_20??-??-??.json public/ 2>/dev/null || true

            git add public/complete_info.json public/complete_ranking.json
            git add public/complete_20??-??-??.json 2>/dev/null || true
            git add public/store_handles.json public/store_x_urls.json 2>/dev/null || true
            git add scripts/.x_session.enc 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi

            COUNT=$(python3 -c "import json; d=json.load(open('public/complete_info.json')); print(len(d))")
            git commit -m "chore: update complete_info.json (${COUNT}件) + ranking [parallel]"

            if git push; then
              echo "✅ Push succeeded (attempt ${i})"
              break
            else
              git reset HEAD~1
              echo "⚠️ Push attempt ${i} failed, retrying in 10s..."
              sleep 10
            fi
          done

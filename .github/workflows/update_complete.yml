name: Update Complete Info

on:
  schedule:
    # JST 15:00〜翌2:00を30分ごと実行（Publicリポジトリ=無制限無料）
    # UTC 06:00〜17:00（30分間隔）= JST 15:00〜翌2:00
    - cron: "*/30 6-17 * * *"
  workflow_dispatch: # 手動実行も可
    inputs:
      date:
        description: '収集対象日 (YYYY-MM-DD形式、省略時は当日JST)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps

      - name: Fetch complete info from X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "📅 指定日付: ${{ github.event.inputs.date }}"
            python scripts/fetch_complete_info.py --headless --date "${{ github.event.inputs.date }}"
          else
            python scripts/fetch_complete_info.py --headless
          fi

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/complete_info.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(python3 -c "import json; d=json.load(open('public/complete_info.json')); print(len(d))")
            git commit -m "chore: update complete_info.json (${COUNT}件)"
            git pull --rebase origin main
            git push
          fi

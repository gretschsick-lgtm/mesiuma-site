name: Update Machine Specs (P-World)

# ⚠️ DISABLED: DMM/P-WORLD 自動収集停止 (2026-05)
# 再有効化するには schedule: を復元し、fetch ジョブの if: false を削除する
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '特定機種IDをカンマ区切りで指定（例: 9923,10207）省略時は全件'
        required: false
        default: ''
      months:
        description: '新台カレンダーを何ヶ月分取得するか（デフォルト3）'
        required: false
        default: '3'
      known_only:
        description: '既知機種リストのみ収集（カレンダー取得しない）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  fetch:
    if: false  # DISABLED
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch machine specs from P-World
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.ids }}" ]; then
            ARGS="$ARGS --ids ${{ github.event.inputs.ids }}"
          fi
          if [ -n "${{ github.event.inputs.months }}" ]; then
            ARGS="$ARGS --months ${{ github.event.inputs.months }}"
          fi
          if [ "${{ github.event.inputs.known_only }}" = "true" ]; then
            ARGS="$ARGS --known-only"
          fi
          python scripts/fetch_machine_specs.py $ARGS

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/machine_specs.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(python3 -c "import json; d=json.load(open('public/machine_specs.json')); print(len(d))")
            git commit -m "chore: update machine_specs.json (${COUNT}機種)"
            git pull --rebase origin main
            git push
          fi

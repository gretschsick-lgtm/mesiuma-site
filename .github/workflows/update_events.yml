name: Update Events

on:
  schedule:
    # 毎時間実行（Publicリポジトリ=無制限無料）
    # UTC 0-23時 毎時 = JST 9:00〜翌8:00
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── JOB A: X アカウントタイムライン（メディア + 個別店舗）──────────────
  fetch-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps
      - name: Fetch accounts timeline
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_events.py --headless --job accounts
      - uses: actions/upload-artifact@v4
        with:
          name: events-accounts
          path: public/events_public.json
          retention-days: 1

  # ─── JOB B: X キーワード検索（300+クエリ）───────────────────────────────
  fetch-search:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps
      - name: Fetch X search
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_events.py --headless --job search
      - uses: actions/upload-artifact@v4
        with:
          name: events-search
          path: public/events_public.json
          retention-days: 1

  # ─── JOB C: Yahoo!リアルタイム + Google News ────────────────────────────
  fetch-google:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps
      - name: Fetch Yahoo/Google
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_events.py --headless --job google
      - uses: actions/upload-artifact@v4
        with:
          name: events-google
          path: public/events_public.json
          retention-days: 1

  # ─── JOB D: 公式イベントサイト（ぱちタウン/スロパチ/ジャンバリ等）──────
  fetch-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps
      - name: Fetch web event sites
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_events.py --headless --job web
      - uses: actions/upload-artifact@v4
        with:
          name: events-web
          path: public/events_public.json
          retention-days: 1

  # ─── JOB E: YouTube（yt-dlp ベース・ボット検知回避）────────────────────
  fetch-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth yt-dlp
          playwright install chromium --with-deps
      - name: Fetch YouTube channels & search
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_events.py --headless --job youtube
      - uses: actions/upload-artifact@v4
        with:
          name: events-youtube
          path: public/events_public.json
          retention-days: 1

  # ─── (削除済み) JOB F: p-town / P-World は法的リスク回避のためジョブ自体を撤去 ─

  # ─── MERGE: 5ジョブの結果をマージしてコミット ────────────────────────────
  merge-and-push:
    runs-on: ubuntu-latest
    needs: [fetch-accounts, fetch-search, fetch-google, fetch-web, fetch-youtube]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download accounts result
        uses: actions/download-artifact@v4
        with:
          name: events-accounts
          path: artifacts/accounts
        continue-on-error: true

      - name: Download search result
        uses: actions/download-artifact@v4
        with:
          name: events-search
          path: artifacts/search
        continue-on-error: true

      - name: Download google result
        uses: actions/download-artifact@v4
        with:
          name: events-google
          path: artifacts/google
        continue-on-error: true

      - name: Download web result
        uses: actions/download-artifact@v4
        with:
          name: events-web
          path: artifacts/web
        continue-on-error: true

      - name: Download youtube result
        uses: actions/download-artifact@v4
        with:
          name: events-youtube
          path: artifacts/youtube
        continue-on-error: true

      - name: Merge all results
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          merged: dict[str, dict] = {}

          # 既存ベース読み込み
          existing = Path("public/events_public.json")
          if existing.exists():
              try:
                  data = json.loads(existing.read_text(encoding="utf-8"))
                  events = data if isinstance(data, list) else data.get("events", [])
                  for e in events:
                      key = e.get("id") or e.get("url") or str(e)
                      if key:
                          merged[key] = e
              except Exception as ex:
                  print(f"既存ファイル読み込みエラー: {ex}")

          # 各ジョブ結果マージ
          for artifact_dir in ["artifacts/accounts", "artifacts/search", "artifacts/google", "artifacts/web", "artifacts/youtube"]:
              p = Path(artifact_dir) / "events_public.json"
              if not p.exists():
                  print(f"スキップ: {artifact_dir}")
                  continue
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  events = data if isinstance(data, list) else data.get("events", [])
                  before = len(merged)
                  for e in events:
                      key = e.get("id") or e.get("url") or str(e)
                      if key:
                          merged[key] = e
                  print(f"{artifact_dir}: {len(events)} 件 → +{len(merged)-before} 新規")
              except Exception as ex:
                  print(f"エラー {artifact_dir}: {ex}")

          # 日付降順ソート・上限1.5万件
          result = sorted(merged.values(), key=lambda e: e.get("date", ""), reverse=True)[:15000]
          Path("public/events_public.json").write_text(
              json.dumps({"events": result}, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"\n✅ マージ完了: {len(result)} 件")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/events_public.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COUNT=$(python3 -c "import json; d=json.load(open('public/events_public.json')); print(len(d.get('events', d) if isinstance(d, dict) else d))")
            git commit -m "chore: update events_public.json (${COUNT}件)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || {
                # 並行 push によるコンフリクトは自分の版（マージ済み）を優先
                git checkout --theirs public/events_public.json
                git add public/events_public.json
                GIT_EDITOR=: git rebase --continue
              }
              git push && break
              echo "Push failed, retrying ($i/5)..."
              sleep $((i * 3))
            done
          fi

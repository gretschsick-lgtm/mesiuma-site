name: Free Status Verification (candidate-only)

# NS-P2 — 来店演者候補の「現在フリー/所属」を公開一次情報から自動検証するジョブ。
#
# 重要（構造的安全設計）:
#  - candidate-only。production DB へは書き込まない（DB write = 0）。新 secret 不要。
#  - 一次情報 = 既存 events の店舗投稿 @mention（handle解決）+ x.com の og:description(現在bio)。
#    ※ X ログイン Cookie 等は使わない（未ログインで取得できる公開 og メタのみ）。
#  - FREE_CONFIRMED は本人bioに現在フリー明示 + 実来店 + 鮮度OK の場合のみ。
#    「所属が見つからない=フリー」/ DM開放 / 検索snippet だけでは FREE にしない。
#  - 所属と free の矛盾は CONFLICT_REVIEW（自動FREE禁止）。identity曖昧は IDENTITY_UNCONFIRMED。
#  - 演者への自動連絡（DM/メール/フォロー/送信）はコードに存在しない。commit もしない。

on:
  schedule:
    # 毎日 1 回 UTC 22:30 = JST 07:30（NS-P1 discovery の後段。DB書込なしで競合なし）
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: '1 run で検証する演者数'
        required: false
        default: '30'

concurrency:
  group: verify-free-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verification state (retry cache)
        uses: actions/cache@v4
        with:
          path: scripts/.verify_state.json
          key: free-verify-state-${{ github.run_id }}
          restore-keys: |
            free-verify-state-

      - name: Run free-status verification (NO DB write / NO outreach / NO new secret)
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify_free_status.py scripts/test_verify_free_status.py
          python3 scripts/test_verify_free_status.py
          python3 scripts/test_discover_free_performers.py
          python3 scripts/test_discover_store_x.py
          python3 scripts/test_store_handles_resolution.py
          LIMIT="${{ github.event.inputs.limit }}"; LIMIT="${LIMIT:-30}"
          python3 scripts/verify_free_status.py --limit "$LIMIT" \
            --report public/free_verification_report.json

      - name: Guard — DB書込ゼロ / commit対象なしを確認
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain | grep -vE 'free_verification_report.json|.verify_state.json' || true)
          if [ -n "$CHANGED" ]; then
            echo "❌ 予期しない変更:"; echo "$CHANGED"; exit 1
          fi
          echo "✅ candidate-only: DB書込なし・追跡ファイル変更なし・自動連絡なし・新secretなし"

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-verification-report
          path: public/free_verification_report.json
          if-no-files-found: warn
          retention-days: 14

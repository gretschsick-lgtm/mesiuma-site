name: Update Machine Data

on:
  schedule:
    # 4時間ごと (UTC 0,4,8,12,16,20時 = JST 9,13,17,21,1,5時)
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch: # 手動実行も可

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch machine data from DMM
        run: |
          # 時刻に応じて担当エリアを分散（1回あたり約1/6の都道府県）
          HOUR=$(date -u +%H)
          if   [ "$HOUR" = "00" ] || [ "$HOUR" = "01" ]; then
            PREFS="北海道,青森県,岩手県,宮城県,秋田県,山形県,福島県"
          elif [ "$HOUR" = "04" ] || [ "$HOUR" = "05" ]; then
            PREFS="東京都,神奈川県,埼玉県,千葉県,茨城県,栃木県,群馬県"
          elif [ "$HOUR" = "08" ] || [ "$HOUR" = "09" ]; then
            PREFS="愛知県,静岡県,新潟県,長野県,岐阜県,石川県,富山県,福井県,山梨県"
          elif [ "$HOUR" = "12" ] || [ "$HOUR" = "13" ]; then
            PREFS="大阪府,兵庫県,京都府,奈良県,滋賀県,三重県,和歌山県"
          elif [ "$HOUR" = "16" ] || [ "$HOUR" = "17" ]; then
            PREFS="広島県,岡山県,山口県,鳥取県,島根県,愛媛県,香川県,徳島県,高知県"
          else
            PREFS="福岡県,熊本県,鹿児島県,宮崎県,大分県,長崎県,佐賀県,沖縄県"
          fi
          python scripts/fetch_machine_data.py --pref "$PREFS"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/store_machines.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            STORE_COUNT=$(python3 -c "import json; d=json.load(open('public/store_machines.json')); print(len(d))")
            git commit -m "chore: update store_machines.json (${STORE_COUNT}店舗)"
            git push
          fi

name: Update Machine Data

on:
  schedule:
    # 3時間ごと (UTC 0,3,6,9,12,15,18,21時)
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

# リポジトリへの書き込み権限を付与
permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# 12地域に細分化して並列スクレイプ → マージしてコミット
# 各グループ ≤700店 × 約2秒/店 ≒ 24分 → timeout 50分で余裕あり
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 地域1: 北海道・青森・岩手 (508店) ──────────────────────────────────────
  fetch-g1:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "北海道,青森県,岩手県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g1
          path: public/store_machines.json
          retention-days: 1

  # ── 地域2: 東北(秋田・山形・宮城・福島) (391店) ────────────────────────────
  fetch-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "秋田県,山形県,宮城県,福島県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g2
          path: public/store_machines.json
          retention-days: 1

  # ── 地域3: 関東北部(茨城・栃木・群馬・埼玉) (624店) ─────────────────────────
  fetch-g3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "茨城県,栃木県,群馬県,埼玉県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g3
          path: public/store_machines.json
          retention-days: 1

  # ── 地域4: 千葉 (240店) ────────────────────────────────────────────────────
  fetch-g4:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "千葉県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g4
          path: public/store_machines.json
          retention-days: 1

  # ── 地域5: 東京都 (472店) ──────────────────────────────────────────────────
  fetch-g5:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "東京都"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g5
          path: public/store_machines.json
          retention-days: 1

  # ── 地域6: 神奈川・甲信越・北陸(神奈川・山梨・長野・新潟) (558店) ───────────
  fetch-g6:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "神奈川県,山梨県,長野県,新潟県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g6
          path: public/store_machines.json
          retention-days: 1

  # ── 地域7: 北陸・東海(富山・石川・福井・岐阜・静岡) (426店) ─────────────────
  fetch-g7:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "富山県,石川県,福井県,岐阜県,静岡県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g7
          path: public/store_machines.json
          retention-days: 1

  # ── 地域8: 東海・近畿東部(愛知・三重・滋賀) (482店) ───────────────────────
  fetch-g8:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "愛知県,三重県,滋賀県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g8
          path: public/store_machines.json
          retention-days: 1

  # ── 地域9: 近畿(京都・大阪・奈良・和歌山) (606店) ────────────────────────
  fetch-g9:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "京都府,大阪府,奈良県,和歌山県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g9
          path: public/store_machines.json
          retention-days: 1

  # ── 地域10: 兵庫・中国(兵庫・鳥取・島根・岡山・広島・山口) (674店) ──────────
  fetch-g10:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "兵庫県,鳥取県,島根県,岡山県,広島県,山口県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g10
          path: public/store_machines.json
          retention-days: 1

  # ── 地域11: 四国・福岡・長崎(徳島・香川・愛媛・高知・福岡・佐賀・長崎) (634店) ──
  fetch-g11:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "徳島県,香川県,愛媛県,高知県,福岡県,佐賀県,長崎県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g11
          path: public/store_machines.json
          retention-days: 1

  # ── 地域12: 九州南部・沖縄(熊本・大分・宮崎・鹿児島・沖縄) (490店) ───────────
  fetch-g12:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_store_data_pworld.py --pref "熊本県,大分県,宮崎県,鹿児島県,沖縄県"
      - uses: actions/upload-artifact@v4
        with:
          name: machines-g12
          path: public/store_machines.json
          retention-days: 1

  # ── X 新台補完 ─────────────────────────────────────────────────────────────
  fetch-x:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install playwright
        run: |
          pip install playwright playwright-stealth
          playwright install chromium --with-deps
      - name: Fetch from X
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: python scripts/fetch_machine_data.py --source x
      - uses: actions/upload-artifact@v4
        with:
          name: machines-x
          path: public/store_machines.json
          retention-days: 1

  # ── マージ & コミット ──────────────────────────────────────────────────────
  merge-and-push:
    runs-on: ubuntu-latest
    needs: [fetch-g1, fetch-g2, fetch-g3, fetch-g4, fetch-g5, fetch-g6, fetch-g7, fetch-g8, fetch-g9, fetch-g10, fetch-g11, fetch-g12, fetch-x]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Merge all region data
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          merged: dict = {}

          # 既存ベース読み込み
          base = Path("public/store_machines.json")
          if base.exists():
              try:
                  merged = json.loads(base.read_text(encoding="utf-8"))
              except Exception as ex:
                  print(f"既存ファイル読み込みエラー: {ex}")

          # 地域ジョブ (g1-g12) のアーティファクト読み込み
          artifact_dirs = sorted(Path("artifacts").glob("machines-g*/store_machines.json"))
          for p in artifact_dirs:
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  before = len(merged)
                  merged.update(data)
                  print(f"{p.parent.name}: {len(data)}店舗 → +{len(merged)-before}新規")
              except Exception as ex:
                  print(f"エラー {p}: {ex}")

          # X補完: new_machines だけ追記（p-town データを上書きしない）
          x_file = Path("artifacts/machines-x/store_machines.json")
          if x_file.exists():
              try:
                  x_data = json.loads(x_file.read_text(encoding="utf-8"))
                  added = 0
                  for store, info in x_data.items():
                      x_machines = info.get("new_machines", [])
                      if not x_machines:
                          continue
                      if store not in merged:
                          merged[store] = info
                          added += 1
                      else:
                          ex_names = {m["name"] for m in merged[store].get("new_machines", [])}
                          extra = [m for m in x_machines if m["name"] not in ex_names]
                          if extra:
                              merged[store].setdefault("new_machines", [])
                              merged[store]["new_machines"] = extra + merged[store]["new_machines"]
                              added += 1
                  print(f"X補完: {added}店舗を補完")
              except Exception as ex:
                  print(f"X補完エラー: {ex}")

          Path("public/store_machines.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"\n✅ マージ完了: {len(merged)}店舗")
          EOF

      - name: Sync addresses from store_machines to stores.json
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path

          stores_path = Path("public/stores.json")
          machines_path = Path("public/store_machines.json")

          if not stores_path.exists() or not machines_path.exists():
              print("ファイルが見つかりません")
              exit(0)

          stores = json.loads(stores_path.read_text(encoding="utf-8"))
          machines = json.loads(machines_path.read_text(encoding="utf-8"))

          updated_addr = 0
          updated_x = 0
          updated_hp = 0
          for store in stores:
              name = store.get("name", "")
              info = machines.get(name)
              if not info:
                  continue
              # 住所を補完
              if not store.get("address") and info.get("address"):
                  store["address"] = info["address"]
                  updated_addr += 1
              # map_url が空の場合は住所からGoogle Maps URLを生成
              if not store.get("map_url") and store.get("address"):
                  addr = store["address"]
                  store["map_url"] = f"https://www.google.co.jp/maps/search/{addr.replace(' ', '+')}"
              # X URLを補完
              if not store.get("x_url") and info.get("x_url"):
                  store["x_url"] = info["x_url"]
                  updated_x += 1
              # 公式HP URLを補完
              if not store.get("hp_url") and info.get("hp_url"):
                  store["hp_url"] = info["hp_url"]
                  updated_hp += 1

          stores_path.write_text(
              json.dumps(stores, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"✅ 住所補完: {updated_addr}店舗 / X URL: {updated_x}件 / HP URL: {updated_hp}件")
          EOF

      - name: Merge P-World stores into stores.json
        run: python3 scripts/merge_pworld_stores.py

      - name: Fetch lottery/lineup times
        run: python3 scripts/fetch_lottery_time.py --limit 50
        continue-on-error: true
        timeout-minutes: 15

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/store_machines.json public/stores.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('public/store_machines.json'))))")
            LOTTERY=$(python3 -c "import json; s=json.load(open('public/stores.json')); print(sum(1 for x in s if x.get('lottery_time')))")
            git commit -m "chore: update store data (${COUNT}店舗, 抽選時間${LOTTERY}件)"
            git pull --rebase origin main
            git push
          fi
